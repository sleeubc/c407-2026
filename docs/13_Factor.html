How does `ggplot()` know the order among the weekdays on x-axis?

---

Factor


``` r
n_wday$wday %&gt;% class
```

```
[1] "ordered" "factor" 
```


``` r
n_wday$wday
```

```
[1] Sun Mon Tue Wed Thu Fri Sat
Levels: Sun &lt; Mon &lt; Tue &lt; Wed &lt; Thu &lt; Fri &lt; Sat
```

---


``` r
n_wday %&gt;% mutate(wday2 = as.numeric(wday))
```


|wday |     n| wday2|
|:----|-----:|-----:|
|Sun  |     2|     1|
|Mon  |  9844|     2|
|Tue  | 10674|     3|
|Wed  | 10852|     4|
|Thu  | 14630|     5|
|Fri  |  7336|     6|
|Sat  |     8|     7|

For a factor, `ggplot` uses the order in the underlying levels as coordinates.

You can create a factor using factor().

.small[

``` r
tb &lt;- tibble(
	municipality = c("Vancouver", "Richmond", "Surrey", "Port Moody"), 
	value=c(5,1,8,3))
```
]

|municipality | value|
|:------------|-----:|
|Vancouver    |     5|
|Richmond     |     1|
|Surrey       |     8|
|Port Moody   |     3|

---


``` r
ggplot(tb) + geom_col(aes(x=value, y=municipality))
```

.small[

``` r
tb &lt;- tb %&gt;% mutate(
	municipality2 = factor(municipality, levels=c("Richmond", "Port Moody", "Vancouver", "Surrey")))

|Port Moody   |     3|Port Moody    |

### Ordered factor

.small[

``` r
tb &lt;- tb %&gt;% mutate(municipality3 = factor(municipality, levels=c("Surrey", "Vancouver", "Richmond", "Port Moody"), ordered = TRUE))
```


``` r
tb$municipality3 %&gt;% class
```

```
[1] "ordered" "factor" 
```


``` r
tb$municipality3
```

```
[1] Vancouver  Richmond   Surrey     Port Moody
Levels: Surrey &lt; Vancouver &lt; Richmond &lt; Port Moody
```
]

---

You can use inequality conditions with an ordered factor.


``` r
tb %&gt;% mutate(temp = municipality3 &gt;= "Richmond")
```

|municipality | value|municipality2 |municipality3 |temp  |
|:------------|-----:|:-------------|:-------------|:-----|
|Vancouver    |     5|Vancouver     |Vancouver     |FALSE |
|Richmond     |     1|Richmond      |Richmond      |TRUE  |
|Surrey       |     8|Surrey        |Surrey        |FALSE |
|Port Moody   |     3|Port Moody    |Port Moody    |TRUE  |

---

Suppose you want to combine Vancouver and Richmond to have the same name "Vancouver-Richmond".


``` r
tb %&gt;% mutate( municipality4 = case_when(
	municipality3 == "Surrey" ~ "Surrey",
	municipality3 &lt;= "Richmond" ~ "Vancouver-Richmond",
	municipality3 == "Port Moody" ~ "Port Moody",
	.default = NA
))
```

---


|municipality | value|municipality2 |municipality3 |municipality4      |
|:------------|-----:|:-------------|:-------------|:------------------|
|Vancouver    |     5|Vancouver     |Vancouver     |Vancouver-Richmond |
|Richmond     |     1|Richmond      |Richmond      |Vancouver-Richmond |
|Surrey       |     8|Surrey        |Surrey        |Surrey             |
|Port Moody   |     3|Port Moody    |Port Moody    |Port Moody         |

.small[
Generate the figure on the following slide.

1. Convert HDGREE to an ordered factor
    
    ``` r
    pumf &lt;- pumf %&gt;% mutate(HDGREE = as.ordered(HDGREE))
    ```

2. Create HDGREE2 that simplfies HDGREE to have the following levels:  "Less Than High School", "High School Diploma", "Post-Secondary (No Degree)", "Bachelor's Degree", "Graduate Degree". Use case_when()

3. Convert HDGREE2 into a factor so that it will have the natural order.

4. Filter out the observations where HDGREE2 is missing.
    
    ``` r
    filter(! is.na(HDGREE2))
    ```
]

---

&lt;img src="13_Factor_files/figure-html/unnamed-chunk-39-1.png" width="70%" style="display: block; margin: auto;" /&gt;

---

.small[

``` r
pumf &lt;- pumf %&gt;% mutate(
	HDGREE2 = case_when(
		HDGREE == "No certificate, diploma or degree" ~ "Less Than High School",
		HDGREE == "High (secondary) school diploma or equivalency certificate" ~ "High School Diploma",
		HDGREE &lt;= "University certificate or diploma below bachelor level" ~ "Post-Secondary (No Degree)",
		HDGREE == "Bachelor's degree" ~ "Bachelor's Degree",
		HDGREE &lt;= "Earned doctorate" ~ "Graduate Degree",
		.default = NA
	)
)
```
