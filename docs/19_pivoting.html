#### pivot_wider()

.tiny[

``` r
library(cancensus)
renter_csd_van &lt;- get_census("CA16", list(CMA="59933"), level="CSD", 
                             vectors = c("v_CA16_4838", "v_CA16_4836")) 

renter_l &lt;- renter_csd_van %&gt;% select(`Region Name`, `v_CA16_4838: Renter`, `v_CA16_4836: Total - Private households by tenure - 25% sample data`) %&gt;% pivot_longer(-`Region Name`, names_to = "vector")
```
]

#### pivot_longer()

.tiny[

``` r
pindex &lt;- cansim::get_cansim("18-10-0205-01")

pindex_w &lt;- pindex %&gt;% 
  filter(`New housing price indexes` == "Total (house and land)", 
         GEO %&gt;% str_detect("Vancouver|Toronto|Montréal|Victoria|Edmonton|Calgary"),
         lubridate::ym(REF_DATE) &gt;= lubridate::ymd("2016-12-01")) %&gt;% 
  select(REF_DATE, GEO, VALUE) %&gt;% 
  pivot_wider(names_from = REF_DATE, values_from = VALUE)
```
]
