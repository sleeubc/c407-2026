---


``` r
library(tidyverse)

bca &lt;- read_rds("Data/bca252.rds")

avg_price &lt;- bca %&gt;% 
  mutate(sale_year = lubridate::year(sale_date)) %&gt;% 
  group_by(act_use_cat, sale_year) %&gt;% 
  summarise(avg_price = mean(price, na.rm = TRUE))
```

Saving plot

Save your last plot as "price_hist_aa.png" in "Temp" subfolder.


``` r
ggsave("Temp/price_hist_aa.png", bg="white")
```

But the size and the aspect ratio of the resulting plot is arbitrary and may not be ideal.

---

You must set the size of the figure by setting width, height, units, or scale. You can control the resolution with dpi.


``` r
ggsave("Temp/price_hist_aa_2.png", bg="white",
			 width = 16, height = 9, units="cm")
```

When adjusting the figure size, it does not change text font size, making font size relatively too big or too small. 

--

You can adjust the font size using `theme(text=element_text(size = ))`

``` r
ggsave("Temp/price_hist_aa_3.png", 
			 plot = last_plot() + theme(text=element_text(size=9)),
			 bg="white", width = 16, height = 9, units="cm")
```
