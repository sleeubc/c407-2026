``` r

library(tidyverse)
```


``` r
bca &lt;- read_rds("Data/bca252.rds")
```

---


``` r
by_aa &lt;- bca %&gt;%
  filter(!is.na(aa_label)) %&gt;%
  group_by(aa_label) %&gt;%
  summarise(
    avg_floorarea = mean(floorarea, na.rm = TRUE),
    avg_price = mean(price, na.rm = TRUE),
    n = n()
  )
```

### Scale functions

.tiny[

``` r
ggplot(by_aa) +
  geom_point(aes(avg_floorarea, avg_price, color = aa_label, size = n))
```

&lt;img src="10_ggplot2_2_files/figure-html/unnamed-chunk-23-1.png" width="70%" style="display: block; margin: auto;" /&gt;

---

We want to

- Remove the size legend.

- Rename the name (aa_label) for the color legend to "Assessment Area".

- Format numbers on axis better. (e.g., $900K instead of 9e+05, 2,200 instead of 2200.)

- Rename axis names.

Note these are all related to aesthetic properties.

--

Use scale functions!

---

.tiny[

``` r
ggplot(by_aa) +
  geom_point(aes(avg_floorarea, avg_price, color = aa_label, size = n)) +
  scale_color_discrete(name = "Assessment Area") +
  scale_size(guide = NULL)
```

&lt;img src="10_ggplot2_2_files/figure-html/unnamed-chunk-24-1.png" width="70%" style="display: block; margin: auto;" /&gt;
]

---

.horizontal-scroll[
.tiny[

``` r
ggplot(by_aa) +
  geom_point(aes(avg_floorarea, avg_price, color = aa_label, size = n)) +
  scale_color_discrete(name = "Assessment Area") +
  scale_size(guide = NULL) +
  scale_x_continuous(name = "Average Floor Area (sq ft)", labels = scales::label_comma()) +
  scale_y_continuous(name = "Average Price", labels = scales::label_comma(scale = 0.001, prefix = "$", suffix = "K"))
```

&lt;img src="10_ggplot2_2_files/figure-html/unnamed-chunk-25-1.png" width="70%" style="display: block; margin: auto;" /&gt;
]
]
